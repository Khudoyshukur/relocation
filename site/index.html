<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Relocation Jobs</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1b1f24; --muted: #5f6b7a;
    --border: #dfe3e8; --accent: #2f6fde; --accent-text: #ffffff;
    --green-bg: #e3f5e9; --green: #1d7a3e; --amber-bg: #fff3d6; --amber: #8a5a00;
    --red-bg: #fde7e7; --red: #b3261e; --blue-bg: #e5eefc; --blue: #2156b8; --gray-bg: #eceff3;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1f252d; --text: #e6e9ee; --muted: #98a3b1;
      --border: #2a313a; --accent: #5b8ff0; --accent-text: #0b0e12;
      --green-bg: #15301f; --green: #6fd394; --amber-bg: #33280f; --amber: #f0c060;
      --red-bg: #3a1716; --red: #f28b82; --blue-bg: #172640; --blue: #8fb4f7; --gray-bg: #232a33;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .stat b { font-size: 16px; margin-right: 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .tabs button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  input[type=search], select, input[type=text], input[type=password] {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { flex: 1; min-width: 160px; }
  .btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.archived { opacity: .7; }
  .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-weight: 600; font-size: 16px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--gray-bg); }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .summary { margin: 8px 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .comments { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .comment { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
  .comment .when { color: var(--muted); font-size: 12px; white-space: nowrap; padding-top: 2px; }
  .comment .text { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment .del { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
  .add { display: flex; gap: 8px; margin-top: 8px; }
  .add input { flex: 1; min-width: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 12px; border: 1px dashed var(--border); background: none; border-radius: 999px; padding: 2px 8px; cursor: pointer; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .setup { max-width: 560px; margin: 60px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
  .setup ol { padding-left: 20px; }
  .setup input { width: 100%; margin: 8px 0 12px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .error { color: var(--red); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
// Logging in decrypts a GitHub token and a notes key from config.js (built at deploy
// time from repo secrets). Notes are stored encrypted in data/tracking.json.
const OWNER = "Khudoyshukur";
const REPO = "relocation";
const BRANCH = "main";
const JOBS_PATH = "data/jobs.json";
const TRACKING_PATH = "data/tracking.json";

const STATUSES = [
  ["new", "New"], ["interested", "Interested"], ["referral", "Referral asked"],
  ["applied", "Applied"], ["interviewing", "Interviewing"], ["offer", "Offer"], ["rejected", "Rejected"],
];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const QUICK_NOTES = ["Asked referral from ", "Sent connection to ", "Applied via website", "Waiting response", "Rejected"];

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};

const state = {
  token: null,
  dataKey: null,
  jobs: [],
  tracking: { jobs: {} },
  trackingSha: null,
  tab: "active",
  status: "all",
  query: "",
  sort: "newest",
  lastVisit: store.get("last_visit"),
  drafts: {},
};

const app = document.getElementById("app");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeUrl(url) { return /^https?:\/\//i.test(url || "") ? url : "#"; }
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200);
}

// ---------- Encoding and encryption ----------
const enc = new TextEncoder(), dec = new TextDecoder();
function bytesToB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64) { return Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)); }
function b64encode(str) { return bytesToB64(enc.encode(str)); }
function b64decode(b64) { return dec.decode(b64ToBytes(b64)); }

// Must match scripts/build-config.mjs.
async function passwordKey(username, password, salt, iterations) {
  const material = await crypto.subtle.importKey(
    "raw", enc.encode(`${username.trim().toLowerCase()}\n${password}`), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function encryptJson(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, state.dataKey, enc.encode(JSON.stringify(obj))));
  return { encrypted: true, iv: bytesToB64(iv), data: bytesToB64(data) };
}
async function decryptJson(file) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(file.iv) }, state.dataKey, b64ToBytes(file.data));
  return JSON.parse(dec.decode(plain));
}

// ---------- Login ----------
async function startSession(session) {
  state.token = session.token;
  state.dataKey = await crypto.subtle.importKey("raw", b64ToBytes(session.dataKey), "AES-GCM", false, ["encrypt", "decrypt"]);
}
async function login(username, password) {
  const cfg = window.SITE_CONFIG;
  if (!cfg) throw new Error("The site isn't configured yet (missing login secrets).");
  const key = await passwordKey(username, password, b64ToBytes(cfg.salt), cfg.iterations);
  let session;
  try {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(cfg.iv) }, key, b64ToBytes(cfg.data));
    session = JSON.parse(dec.decode(plain));
  } catch {
    throw new Error("Wrong username or password.");
  }
  await startSession(session);
  store.set("session", JSON.stringify(session));
}
function logout(message) {
  state.token = null; state.dataKey = null;
  store.remove("session");
  renderSetup(message);
}

// ---------- GitHub API ----------
async function gh(path, opts = {}) {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
    cache: "no-store",
    ...opts,
    headers: { Authorization: `Bearer ${state.token}`, "X-GitHub-Api-Version": "2022-11-28", ...(opts.headers || {}) },
  });
  if (res.status === 401) throw Object.assign(new Error("Token was rejected (expired or wrong?)."), { auth: true });
  if (res.status === 404) throw Object.assign(new Error(`Can't see ${path}. Does the token have access to ${OWNER}/${REPO}?`), { auth: true });
  return res;
}
async function loadJobs() {
  const res = await gh(JOBS_PATH, { headers: { Accept: "application/vnd.github.raw+json" } });
  if (!res.ok) throw new Error(`Loading jobs failed (${res.status})`);
  return res.json();
}
async function loadTracking() {
  const res = await gh(TRACKING_PATH);
  if (!res.ok) throw new Error(`Loading notes failed (${res.status})`);
  const file = await res.json();
  const stored = JSON.parse(b64decode(file.content));
  let data;
  try {
    data = stored.encrypted ? await decryptJson(stored) : stored; // plain only before the first save
  } catch {
    throw new Error("Couldn't decrypt your notes. The notes key (SITE_DATA_KEY secret) may have changed.");
  }
  if (!data.jobs) data.jobs = {};
  return { data, sha: file.sha };
}

// Applies a change to the notes and saves it. If someone else saved in between
// (another tab or device), it reloads the latest notes and applies the change again.
let saveChain = Promise.resolve();
function mutate(change) {
  change(state.tracking);
  render();
  saveChain = saveChain.then(async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      const encrypted = await encryptJson(state.tracking);
      const res = await gh(TRACKING_PATH, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Update notes", branch: BRANCH, sha: state.trackingSha,
          content: b64encode(JSON.stringify(encrypted, null, 2) + "\n"),
        }),
      });
      if (res.ok) { state.trackingSha = (await res.json()).content.sha; toast("Saved"); return; }
      if (res.status !== 409 && res.status !== 422) throw new Error(`Save failed (${res.status})`);
      const fresh = await loadTracking();
      state.tracking = fresh.data; state.trackingSha = fresh.sha;
      change(state.tracking);
    }
    throw new Error("Save failed after retries");
  }).catch(err => { toast(err.message); console.error(err); }).finally(render);
}

function track(tracking, id) {
  return tracking.jobs[id] ||= { status: "new", archived: false, comments: [] };
}

// ---------- Actions ----------
function setStatus(id, status) {
  mutate(t => { track(t, id).status = status; });
}
function toggleArchive(id) {
  const archived = !(state.tracking.jobs[id]?.archived);
  mutate(t => { track(t, id).archived = archived; });
}
function addComment(id) {
  const text = (state.drafts[id] || "").trim();
  if (!text) return;
  const comment = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, at: new Date().toISOString() };
  state.drafts[id] = "";
  mutate(t => {
    const c = track(t, id).comments;
    if (!c.some(x => x.id === comment.id)) c.push(comment);
  });
}
function deleteComment(id, commentId) {
  if (!confirm("Delete this comment?")) return;
  mutate(t => { const j = track(t, id); j.comments = j.comments.filter(c => c.id !== commentId); });
}

// ---------- Rendering ----------
function relocationBadge(r) {
  if (r === "confirmed") return `<span class="badge b-green">Relocation confirmed</span>`;
  if (r === "likely") return `<span class="badge b-amber">Relocation likely</span>`;
  return `<span class="badge">Relocation unclear</span>`;
}
function fitBadge(f) {
  const cls = f === "high" ? "b-blue" : "";
  return `<span class="badge ${cls}">${esc(f || "medium")} fit</span>`;
}

function visibleJobs() {
  const q = state.query.toLowerCase();
  let list = state.jobs.filter(job => {
    const t = state.tracking.jobs[job.id] || {};
    if (state.tab === "active" && t.archived) return false;
    if (state.tab === "archived" && !t.archived) return false;
    if (state.status !== "all" && (t.status || "new") !== state.status) return false;
    if (q) {
      const hay = [job.title, job.company, job.location, job.summary, ...(t.comments || []).map(c => c.text)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const fitRank = { high: 0, medium: 1, low: 2 };
  if (state.sort === "newest") list.sort((a, b) => (b.foundAt || "").localeCompare(a.foundAt || ""));
  if (state.sort === "company") list.sort((a, b) => a.company.localeCompare(b.company));
  if (state.sort === "fit") list.sort((a, b) => (fitRank[a.fit] ?? 1) - (fitRank[b.fit] ?? 1));
  return list;
}

function jobCard(job) {
  const t = state.tracking.jobs[job.id] || { status: "new", archived: false, comments: [] };
  const isNew = state.lastVisit && job.foundAt && job.foundAt > state.lastVisit;
  const comments = (t.comments || []).map(c => `
    <div class="comment">
      <span class="when">${fmtDate(c.at)}</span>
      <span class="text">${esc(c.text)}</span>
      <button class="del" title="Delete" data-act="del" data-id="${esc(job.id)}" data-cid="${esc(c.id)}">✕</button>
    </div>`).join("");
  return `
  <article class="card ${t.archived ? "archived" : ""}">
    <div class="top">
      <div>
        <h2 class="title"><a href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener noreferrer">${esc(job.title)}</a></h2>
        <div class="meta">${esc(job.company)} · ${esc(job.location || "")}</div>
      </div>
      <div class="controls">
        <select data-act="status" data-id="${esc(job.id)}" aria-label="Status">
          ${STATUSES.map(([v, l]) => `<option value="${v}" ${(t.status || "new") === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button class="btn" data-act="archive" data-id="${esc(job.id)}">${t.archived ? "Unarchive" : "Archive"}</button>
      </div>
    </div>
    <div class="badges">
      ${isNew ? `<span class="badge b-blue">New</span>` : ""}
      ${job.closedAt ? `<span class="badge b-red">Posting closed ${fmtDate(job.closedAt)}</span>` : ""}
      ${relocationBadge(job.relocation)}
      ${fitBadge(job.fit)}
      ${job.salary ? `<span class="badge">${esc(job.salary)}</span>` : ""}
    </div>
    ${job.summary ? `<p class="summary">${esc(job.summary)}</p>` : ""}
    <div class="meta">Found ${fmtDate(job.foundAt)}${job.postedAt ? ` · Posted ${fmtDate(job.postedAt)}` : ""}</div>
    <div class="comments">
      ${comments || `<div class="meta">No notes yet.</div>`}
      <div class="add">
        <input type="text" placeholder="Add a note…" data-act="draft" data-id="${esc(job.id)}" value="${esc(state.drafts[job.id] || "")}">
        <button class="btn primary" data-act="comment" data-id="${esc(job.id)}">Add</button>
      </div>
      <div class="chips">
        ${QUICK_NOTES.map(n => `<button class="chip" data-act="chip" data-id="${esc(job.id)}" data-text="${esc(n)}">${esc(n.trim())}</button>`).join("")}
      </div>
    </div>
  </article>`;
}

function render() {
  if (!state.token) return renderSetup();
  const focused = document.activeElement;
  const focusId = focused?.dataset?.act === "draft" ? focused.dataset.id : null;
  const focusSearch = focused?.id === "search";

  const counts = { total: 0, archived: 0 };
  const byStatus = {};
  for (const job of state.jobs) {
    const t = state.tracking.jobs[job.id] || {};
    counts.total++;
    if (t.archived) { counts.archived++; continue; }
    const s = t.status || "new";
    byStatus[s] = (byStatus[s] || 0) + 1;
  }
  const list = visibleJobs();

  app.innerHTML = `
    <header>
      <h1>Relocation Jobs</h1>
      <span class="sub">${counts.total} found · updated automatically every 8 hours ·
        <a href="#" data-act="refresh">Refresh</a> · <a href="#" data-act="logout">Sign out</a></span>
    </header>
    <div class="stats">
      ${STATUSES.filter(([v]) => byStatus[v]).map(([v, l]) => `<span class="stat"><b>${byStatus[v]}</b>${l}</span>`).join("")}
      <span class="stat"><b>${counts.archived}</b>Archived</span>
    </div>
    <div class="toolbar">
      <div class="tabs">
        ${[["active", "Active"], ["archived", "Archived"], ["all", "All"]].map(([v, l]) =>
          `<button class="${state.tab === v ? "on" : ""}" data-act="tab" data-v="${v}">${l}</button>`).join("")}
      </div>
      <select data-act="filter" aria-label="Filter by status">
        <option value="all">All statuses</option>
        ${STATUSES.map(([v, l]) => `<option value="${v}" ${state.status === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <select data-act="sort" aria-label="Sort">
        ${[["newest", "Newest first"], ["fit", "Best fit"], ["company", "Company"]].map(([v, l]) =>
          `<option value="${v}" ${state.sort === v ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <input type="search" id="search" placeholder="Search jobs and notes" value="${esc(state.query)}">
    </div>
    ${list.length ? list.map(jobCard).join("") : `<div class="empty">No jobs here.</div>`}
  `;

  if (focusId) {
    const el = app.querySelector(`input[data-act="draft"][data-id="${CSS.escape(focusId)}"]`);
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  } else if (focusSearch) {
    const el = document.getElementById("search");
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  }
}

function renderSetup(error) {
  app.innerHTML = `
    <form class="setup" data-act="login">
      <h1>Relocation Jobs</h1>
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="login-btn">Log in</button>
      ${error ? `<p class="error">${esc(error)}</p>` : ""}
    </form>`;
  document.getElementById("username").focus();
}

async function load() {
  if (!state.token) return renderSetup();
  app.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const [jobs, tracking] = await Promise.all([loadJobs(), loadTracking()]);
    state.jobs = Array.isArray(jobs) ? jobs : [];
    state.tracking = tracking.data;
    state.trackingSha = tracking.sha;
    render();
    store.set("last_visit", new Date().toISOString());
  } catch (err) {
    if (err.auth) return logout(`${err.message} Ask for the SITE_GH_TOKEN secret to be renewed, then log in again.`);
    app.innerHTML = `<div class="empty error">${esc(err.message)} <a href="#" data-act="refresh">Retry</a></div>`;
  }
}

// ---------- Events ----------
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  if (act === "logout") {
    e.preventDefault(); logout();
  } else if (act === "refresh") {
    e.preventDefault(); load();
  } else if (act === "tab") {
    state.tab = el.dataset.v; render();
  } else if (act === "archive") {
    toggleArchive(id);
  } else if (act === "comment") {
    addComment(id);
  } else if (act === "del") {
    deleteComment(id, el.dataset.cid);
  } else if (act === "chip") {
    state.drafts[id] = el.dataset.text;
    render();
    const input = app.querySelector(`input[data-act="draft"][data-id="${CSS.escape(id)}"]`);
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
});
app.addEventListener("change", e => {
  const { act, id } = e.target.dataset;
  if (act === "status") setStatus(id, e.target.value);
  if (act === "filter") { state.status = e.target.value; render(); }
  if (act === "sort") { state.sort = e.target.value; render(); }
});
app.addEventListener("input", e => {
  if (e.target.id === "search") { state.query = e.target.value; render(); }
  if (e.target.dataset.act === "draft") state.drafts[e.target.dataset.id] = e.target.value;
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.act === "draft") addComment(e.target.dataset.id);
});
app.addEventListener("submit", async e => {
  if (e.target.dataset.act !== "login") return;
  e.preventDefault();
  const button = document.getElementById("login-btn");
  button.disabled = true; button.textContent = "Checking…";
  try {
    await login(document.getElementById("username").value, document.getElementById("password").value);
    load();
  } catch (err) {
    renderSetup(err.message);
  }
});

(async () => {
  store.remove("gh_token"); // from the earlier token-based login
  try {
    const saved = JSON.parse(store.get("session") || "null");
    if (saved) await startSession(saved);
  } catch { store.remove("session"); }
  load();
})();
</script>
</body>
</html>
